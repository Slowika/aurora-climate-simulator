# Submit a `fetch_era5` run as an Azure ML command job on an existing compute:
#
#   az ml job create -f jobs/fetch_era5_job.yml
#
# Fill in the placeholders below, or override individual ones at submit time, e.g.:
#
#   az ml job create -f jobs/fetch_era5_job.yml \
#       --set inputs.start_date=2026-01-01 --set inputs.end_date=2026-02-28
#
# Runs `data.fetch_era5` in the `aurora-cs-data-env` environment (register it first with
# `az ml environment create -f environments/data/environment.yml`), with the inputs below
# forwarded as CLI args.
$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json

display_name: fetch_era5

code: ../data
environment: azureml:aurora-cs-data-env@latest
command: >-
  python fetch_era5.py
  --start-date ${{inputs.start_date}}
  --end-date ${{inputs.end_date}}
  --sharded ${{outputs.sharded}}

inputs:
  start_date: <START_DATE>
  end_date: <END_DATE>

outputs:
  sharded:
    # uri_folder data asset versions are not frozen to snapshot as at creation
    type: uri_folder
    mode: rw_mount
    # Azure ML URI of the output, should be stable across runs
    # e.g., azureml://datastores/${{default_datastore}}/paths/era5_shards/
    path: <OUTPUT_AZUREML_URI>
    name: <AZUREML_DATA_ASSET_NAME>
    # version optional, Azure ML auto-increments from 1 if absent
    # version: <AZUREML_DATA_ASSET_VERSION>

compute: azureml:<COMPUTE_NAME>
# Azure ML uses the compute's managed identity to access the mounted output datastore.
identity:
  type: managed
# Fetching a month of atmospheric data at 6-hourly cadence takes ~1.6h; leave generous headroom.
limits:
  timeout: 21600
