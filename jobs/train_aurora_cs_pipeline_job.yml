# Submit `train_aurora_cs` as an Azure ML pipeline job on an existing compute:
#
#   az ml job create -f jobs/train_aurora_cs_pipeline_job.yml
#
# Fill in the placeholders below, or override individual ones at submit time, e.g.:
#
#   az ml job create -f jobs/train_aurora_cs_pipeline_job.yml \
#       --set inputs.epochs=10 --set inputs.lr=0.0005
#
# Uses the `aurora-cs-torch-env` environment (register it first with
# `az ml environment create -f environment/torch/environment.yml`).
#
# `era5_data` and `co2_data` should be registered assets (from fetch_era5 / fetch_co2_forcing).
# Training runs one forward/backward pass per adjacent triple of 6-hourly steps found in
# `era5_data` - no separate rollout-preparation step is needed.
#
# Single-step pipeline job to make use of the component and its additional_includes (command jobs cannot)
$schema: https://azuremlschemas.azureedge.net/latest/pipelineJob.schema.json
type: pipeline

display_name: train_aurora_cs

inputs:
  era5_data:
    type: uri_folder
    path: azureml:<ERA5_ASSET_NAME>:<ERA5_ASSET_VERSION>
  co2_data:
    type: uri_file
    path: azureml:<CO2_ASSET_NAME>:<CO2_ASSET_VERSION>
  model_name: <MODEL_NAME>
  epochs: 5
  lr: 0.001

jobs:
  train_aurora_cs:
    type: command
    component: ../components/train_aurora_cs/component.yml
    inputs:
      era5_data: ${{inputs.era5_data}}
      co2_data: ${{inputs.co2_data}}
      model_name: ${{inputs.model_name}}
      epochs: ${{inputs.epochs}}
      lr: ${{inputs.lr}}
    # Training benefits from a GPU compute target; nothing in the code requires one (falls back to
    # CPU), but real training runs will be far too slow without it.
    compute: azureml:<COMPUTE_NAME>
    # Adjust based on `epochs` and the number of steps covered by `era5_data`.
    limits:
      timeout: 7200

settings:
  default_compute: azureml:<COMPUTE_NAME>

# Mount the input assets as the compute's managed identity (the storage account is AAD-only).
# (OPTIONAL) use the identity.client_id field to specify a managed identity
identity:
  type: managed