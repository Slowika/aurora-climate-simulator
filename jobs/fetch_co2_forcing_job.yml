# Submit a `fetch_co2_forcing` run as an Azure ML command job on an existing compute:
#
#   az ml job create -f jobs/fetch_co2_forcing_job.yml
#
# Fill in the placeholders below, or override individual ones at submit time, e.g.:
#
#   az ml job create -f jobs/fetch_co2_forcing_job.yml \
#       --set inputs.scenario=ssp245 --set inputs.start_date=2020-01-01
#
# --scenario must be one of: ssp126, ssp245, ssp370, ssp585
#
# Runs `data.fetch_co2_forcing` in the `aurora-cs-data-env` environment (see fetch_era5_job.yml
# for registration), with the inputs below forwarded as CLI args.
$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json

display_name: fetch_co2_forcing

code: ../data
environment: azureml:aurora-cs-data-env@latest
command: >-
  python fetch_co2_forcing.py
  --start-date ${{inputs.start_date}}
  --end-date ${{inputs.end_date}}
  --scenario ${{inputs.scenario}}
  --output ${{outputs.output}}

inputs:
  start_date: <START_DATE>
  end_date: <END_DATE>
  scenario: <SCENARIO>

outputs:
  output:
    type: uri_file
    path: <OUTPUT_PATH>
    name: <AZUREML_DATA_ASSET_NAME>
    # version optional, Azure ML auto-increments from 1 if absent
    # version: <AZUREML_DATA_ASSET_VERSION>

compute: azureml:<COMPUTE_NAME>
# Azure ML uses the compute's managed identity to access the mounted output.
identity:
  type: managed
# A single small file download - much lighter than fetch_era5.
limits:
  timeout: 1800
