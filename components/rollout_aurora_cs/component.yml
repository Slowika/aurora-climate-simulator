$schema: https://azuremlschemas.azureedge.net/latest/commandComponent.schema.json
name: rollout_aurora_cs
version: 1
display_name: Rollout AuroraCS
type: command
description: Run the AuroraCS autoregressive rollout conditioned on a CO2 forcing trajectory.
inputs:
  initial_condition:
    type: uri_folder
    description: Aurora-ready history window.
  forcing_trajectory:
    type: uri_file
    description: Per-step CO2 forcing trajectory, a torch-saved 1-D tensor.
  model_id:
    type: string
    description: Registered AuroraCS model to roll out, e.g. 'aurora-cs-adapter/3'.
  num_steps:
    type: integer
    description: Number of 6-hourly rollout steps.
  prefix:
    type: string
    description: Blob path prefix under the datastore; each step is written as <prefix>/<YYYYmmddTHHMMSS>.nc.
  asset_name:
    type: string
    description: Name of the data asset registered over the NetCDF outputs.
  datastore_name:
    type: string
    default: workspaceblobstore
    description: Workspace blob datastore to write into.
  subscription_id:
    type: string
  resource_group:
    type: string
  workspace_name:
    type: string
  managed_identity_client_id:
    type: string
    description: Client ID of the compute's user-assigned identity.
code: .
# The model is rebuilt from its registered weights + config using the `aurora_cs` package.
additional_includes:
  - ../../aurora_cs
  - ../../data
environment: azureml:aurora-cs-torch-env@latest
command: >-
  python rollout_aurora_cs.py
  --initial-condition ${{inputs.initial_condition}}
  --forcing-trajectory ${{inputs.forcing_trajectory}}
  --model-id ${{inputs.model_id}}
  --num-steps ${{inputs.num_steps}}
  --prefix ${{inputs.prefix}}
  --asset-name ${{inputs.asset_name}}
  --datastore-name ${{inputs.datastore_name}}
  --subscription-id ${{inputs.subscription_id}}
  --resource-group ${{inputs.resource_group}}
  --workspace-name ${{inputs.workspace_name}}
  --managed-identity-client-id ${{inputs.managed_identity_client_id}}
